<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: antiquewhite;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0px;
        }

        header {
            background-color: blueviolet;
            color: white;
            margin: 0px;
            text-align: center;
            padding: 10px;
            
        }

        h1,p {
            margin: 5px;
        }

        nav {
            float: left;
            width: 20%;
            height: 300px;
            background-color:aquamarine;
        }

        section {
            float: right;
            width: 80%;
            height: 300px;
            background-color: aqua;
        }

        footer {
            clear: both;
            background-color: black;
            color: white;
            height: 40px;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Blog Page</h1>
    </header>

    <nav>
        <h1>Links</h1>
        <ul>
            <li><a href="https://naver.com">naver</a></li>
            <li><a href="https://google.com">google</a></li>
            <li><a href="https://daum.net">daum</a></li>
        </ul>
        <figure>
            <img width="80" height="80" src="man.png">
        </figure>
    </nav>

    <section>
        <article>
            <h1>Semantic Tags</h1>
            <p>
                시멘틱 요소(Semantic elements)들은 브라우저에게 요소의 
                의미나 목적을 명확하게 알려주는 요소이다.
            </p>
        </article>
        <article>
            <h1>div와 span</h1>
            <p>
                div은 "divide"의 약자로서 페이지를 논리적인 섹션으로 분리하는데
                사용되는 태그이다. <br>
                span 요소는 인라인 요소로서 텍스트를 위한 컨테이너로 사용할 수 있다.
            </p>
        </article>
    </section>

    <footer>
        Copyright (c) 2026 by BogeunKim
    </footer>
</body>
</html>
